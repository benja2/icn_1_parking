name: ICN T1 parking monitor

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/parking-monitor.yml
      - monitor.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-today:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Send updates every 10 minutes until 22:00 KST
        run: |
          end="$(date -u -d '2026-09-23T13:00:00Z' +%s)"

          while [ "$(date -u +%s)" -lt "$end" ]; do
            python3 monitor.py || echo "Parking check failed; retrying in 10 minutes"
            remaining=$((end - $(date -u +%s)))
            [ "$remaining" -le 0 ] && break
            [ "$remaining" -lt 600 ] && sleep "$remaining" || sleep 600
          done

  wait-until-0330:
    needs: monitor-today
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait without sending notifications
        run: |
          target="$(date -u -d '2026-09-23T18:30:00Z' +%s)"
          while [ "$(date -u +%s)" -lt "$target" ]; do
            remaining=$((target - $(date -u +%s)))
            [ "$remaining" -lt 300 ] && sleep "$remaining" || sleep 300
            echo "Waiting for the next monitoring window"
          done

  wait-until-0755:
    needs: wait-until-0330
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - name: Wait without sending notifications
        run: |
          target="$(date -u -d '2026-09-23T22:55:00Z' +%s)"
          while [ "$(date -u +%s)" -lt "$target" ]; do
            remaining=$((target - $(date -u +%s)))
            [ "$remaining" -lt 300 ] && sleep "$remaining" || sleep 300
            echo "Waiting for the next monitoring window"
          done

  monitor-tomorrow:
    needs: wait-until-0755
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5

      - name: Send updates every 10 minutes from 08:00 to 10:00 KST
        run: |
          start="$(date -u -d '2026-09-23T23:00:00Z' +%s)"
          end="$(date -u -d '2026-09-24T01:00:00Z' +%s)"

          while [ "$(date -u +%s)" -lt "$start" ]; do
            remaining=$((start - $(date -u +%s)))
            [ "$remaining" -lt 60 ] && sleep "$remaining" || sleep 60
          done

          while [ "$(date -u +%s)" -lt "$end" ]; do
            python3 monitor.py || echo "Parking check failed; retrying in 10 minutes"
            remaining=$((end - $(date -u +%s)))
            [ "$remaining" -le 0 ] && break
            [ "$remaining" -lt 600 ] && sleep "$remaining" || sleep 600
          done
