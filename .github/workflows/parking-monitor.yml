name: ICN T1 parking monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-parking:
    runs-on: ubuntu-latest
    env:
      STOP_AT_UTC: "2026-09-24T03:00:00Z"
    steps:
      - name: Stop after the monitoring window
        id: cutoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$STOP_AT_UTC" +%s)" ]; then
            curl --fail-with-body --request PUT \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/parking-monitor.yml/disable"
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cutoff.outputs.stopped != 'true'

      - name: Check parking and send notification
        if: steps.cutoff.outputs.stopped != 'true'
        run: python3 monitor.py
